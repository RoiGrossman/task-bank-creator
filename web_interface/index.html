<!DOCTYPE html>
<html>
<head>
    <title>Target Generator</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <style>
    body {
        background-color: #4d4d4d; 
        color: #ffffff;
        margin: 0;
        padding: 10px;
        font-family: 'Rubik', Segoe UI, sans-serif;
    }
    #map { 
        height: 80vh; width: 50%; }
    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        width: 100%;
    }
    .field { width: 100%; }
    .field input { width: 90%; }
    .full-width { grid-column: span 2; }
    .range-group {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }
    .range-group input { width: 90%; }
    .required::after {
        content: " *";
        color: red;
        font-weight: bold;
    }
    
    .tab-btn { padding: 10px; cursor: pointer; background: #555; color: white; border: none; }
    .tab-btn.active { background: #007bff; } /* צבע לכפתור שנבחר */
    .tab-content { display: none; } /* מוסתר כברירת מחדל */
</style>

<h1>Polygon & Constraints Generator</h1>
<div id="main-container" style="display: flex; width: 100%; gap: 20px;">
    <div id="map"></div>
    
    <!-- Target Inputs -->
    <div id="sidebar" style="width: 50%; padding: 20px; background-color: #383838; height: 75vh; overflow-y: auto;">
        <h2>Target Details</h2>
        <div class="form-grid">
            <div class="field"><label class="required">Name:</label><br><input type="text" id="targetName"></div>
            <div class="field"><label class="required">Priority:</label><br><input type="number" id="priority"></div>
            <div class="field"><label class="required">GSD:</label><br><input type="number" id="resolution" step="any"></div>

            <div class="full-width">
                <h3>Scan azimuth range<span style="font-size: 0.8em; font-weight: normal;"></span></h3>
                <div class="form-grid">
                    <div class="field"><label class="required"></label><label>Min: </label><br><input type="number" id="scanAzMin" step="any"></div>
                    <div class="field"><label class="required"></label><label>Max: </label><br><input type="number" id="scanAzMax" step="any"></div>
                </div>
            </div>

            <div class="full-width">
                <h3>Scan Length range<span style="font-size: 0.8em; font-weight: normal;"></span></h3>
                <div class="form-grid">
                    <div class="field"></label><label>Before CenterP: </label><br><input type="number" id="LenBefCntr" step="any"></div>
                    <div class="field"></label><label>After CenterP: </label><br><input type="number" id="LenAftCntr" step="any"></div>
                </div>
            </div>

            <div class="full-width">
                <h3>Task Date&Time Range <span style="font-size: 0.8em; font-weight: normal;">(UTC)</span></h3>
                <div class="range-group">
                    <div><label class="required">From:</label><br><input type="datetime-local" id="dateRangeStart"></div>
                    <div><label class="required">To:</label><br><input type="datetime-local" id="dateRangeEnd"></div>
                </div>
            </div>

            <div class="full-width">
                <h3>Task Time in Day Range <span style="font-size: 0.8em; font-weight: normal;">(UTC)</span></h3>
                <div class="range-group">
                    <div><label>From:</label><br><input type="time" id="timeInDayStart"></div>
                    <div><label>To:</label><br><input type="time" id="timeInDayEnd"></div>
                </div>
            </div>

            <div class="full-width">
                <h3>View Azimuth Range <span style="font-size: 0.8em; font-weight: normal;">(Clockwise)</span></h3>
                <div class="range-group">
                    <div><label>Min:</label><br><input type="number" id="viewAzMin" step="any"></div>
                    <div><label>Max:</label><br><input type="number" id="viewAzMax" step="any"></div>
                </div>
            </div>

            <div class="full-width">
                <h3>Sat Elevation Range</h3>
                <div class="range-group">
                    <div><label>Min:</label><br><input type="number" id="satElevMin" step="any"></div>
                    <div><label>Max:</label><br><input type="number" id="satElevMax" step="any"></div>
                </div>
            </div>
            
            <div class="full-width">
                <button onclick="exportGeoJSON()" style="padding: 10px 20px; cursor: pointer;">Export to XML</button>
            </div>
        </div>
    </div>

    <!-- Tabs -->
    <div id="Tabs" ...>
    <div class="tab-buttons">
        <button class="tab-btn" onclick="openTab(event, 'POC')">POC</button>
        <button class="tab-btn active" onclick="openTab(event, 'MVP')">MVP</button>
    </div>

        <div id="POC" class="tab-content" style="display: block;">
    </div>

        <div id="MVP" class="tab-content" style="display: none;">
    </div>
</div>
</div>
    
    

    <script>
        // Set default view to USA
        var map = L.map('map').setView([38, -98], 4);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        var drawnItems = new L.FeatureGroup();
        map.addLayer(drawnItems);

        var drawControl = new L.Control.Draw({
            draw: { polygon: true, marker: false, circle: false, rectangle: true, polyline: false },
            edit: { featureGroup: drawnItems }
        });
        map.addControl(drawControl);

        map.on(L.Draw.Event.CREATED, function (e) {
            drawnItems.addLayer(e.layer);
        });

    
    // Function to send the polygon data to our Python API
	async function exportGeoJSON() {
    console.log("Export Started...");

    console.log("Collecting Data...");
    const targetData = {
        name: document.getElementById('targetName').value,
        priority: document.getElementById('priority').value,
        resolution: document.getElementById('resolution').value,
        scanAzMin: document.getElementById('scanAzMin').value, // This field is collected but not implemented in xml!
        scanAzMax: document.getElementById('scanAzMax').value, // This field is collected but not implemented in xml!
        LenBefCntr: document.getElementById('LenBefCntr').value, // This field is collected but not implemented in xml!
        LenAftCntr: document.getElementById('LenAftCntr').value, // This field is collected but not implemented in xml!
        dateRangeStart: document.getElementById('dateRangeStart').value, // This field is collected but not implemented in xml!
        dateRangeEnd: document.getElementById('dateRangeEnd').value, // This field is collected but not implemented in xml!
        timeInDayStart: document.getElementById('timeInDayStart').value || null, // This field is collected but not implemented in xml!
        timeInDayEnd: document.getElementById('timeInDayEnd').value || null,// This field is collected but not implemented in xml!
        viewAzMin: document.getElementById('viewAzMin').value, // This field is collected but not implemented in xml!
        viewAzMax: document.getElementById('viewAzMax').value, // This field is collected but not implemented in xml!
        satElevMin: document.getElementById('satElevMin').value, // This field is collected but not implemented in xml! 
        satElevMax: document.getElementById('satElevMax').value // This field is collected but not implemented in xml! 
 
        // Add new fields here if needed
    };
    console.log("Data Collected");

    console.log("Verifying Data...");
    const mandatoryFieldsVerification = ['targetName', 'priority', 'resolution','scanAzMin', 'scanAzMax', 'dateRangeStart', 'dateRangeEnd' /*Add new fields here if needed*/]; 
    for (let id of mandatoryFieldsVerification) {
        if (!document.getElementById(id).value) {
            console.log("Error: Field missing - " + id);
            alert("Data missing: " + id);
            return;
        }
    }
    console.log("Data Verified");

    // Collect Polygon from the map
    var geoData = drawnItems.toGeoJSON();
    console.log("GeoData length:", geoData.features.length);
    
    if (geoData.features.length === 0) {
        console.log("Error: No polygon");
        alert("Polygon Missing");
        return;
    } 
    console.log("Polygon Collected and verified");

    // Construct structure for the server
    const payload = {
        features: geoData.features.map(feature => ({
            ...feature,
            properties: targetData
        }))
    };


    // Send Payload
    console.log("Starting fetch...");
    const response = await fetch('/generate-xml', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload) 
    });

    if (response.ok) {
        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'manual_target.xml';
        document.body.appendChild(a);
        a.click();
        a.remove();
        alert("XML generated successfully!");
    } else {
        console.log("Server error, status:", response.status);
        alert("Error generating XML");
    }
        console.log("Export Complete");
    }

    function openTab(evt, tabName) {
    // הסתרת כל התוכן
    const contents = document.getElementsByClassName("tab-content");
    for (let i = 0; i < contents.length; i++) contents[i].style.display = "none";

    // הסרת ה-active מכל הכפתורים
    const btns = document.getElementsByClassName("tab-btn");
    for (let i = 0; i < btns.length; i++) btns[i].classList.remove("active");

    // הצגת הטאב הנבחר
    document.getElementById(tabName).style.display = "block";
    evt.currentTarget.classList.add("active");
    }
       	 
    </script>
</body>
</html>

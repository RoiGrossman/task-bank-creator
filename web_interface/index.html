<!DOCTYPE html>
<html>
<head>
    <title>Target Generator</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <style>
        body {
            background-color: #4d4d4d; 
            color: #ffffff; /*Text color*/
            margin: 0;
            padding: 20px;
        }
        #map { height: 500px; width: 50%; }
    </style>
</head>
<body>
    
    <h1>Polygon&Constraints Generator</h1>
    <div id="main-container" style="display: flex; width: 100%;">
    <div id="map" style="height: 500px; width: 50%;"></div>
    
    <div id="sidebar" style="width: 50%; padding: 20px; background-color: #383838;">
        <h3>Target Details</h3>
        <label>Name:</label><br>
        <input type="text" id="targetName"><br><br>
        
        <label>Priority:</label><br>
        <input type="number" id="Priority"><br><br>
        
        <label>Notes:</label><br>
        <textarea id="notes"></textarea><br><br>
        
        <button onclick="saveData()">Apply</button>
        <button onclick="exportGeoJSON()">Export to XML</button>
    </div>
    </div>
    
    

    <script>
        // Set default view to USA
        var map = L.map('map').setView([38, -98], 4);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        var drawnItems = new L.FeatureGroup();
        map.addLayer(drawnItems);

        var drawControl = new L.Control.Draw({
            draw: { polygon: true, marker: false, circle: false, rectangle: true, polyline: false },
            edit: { featureGroup: drawnItems }
        });
        map.addControl(drawControl);

        map.on(L.Draw.Event.CREATED, function (e) {
            drawnItems.addLayer(e.layer);
        });

        // Function to send the polygon data to our Python API
	async function exportGeoJSON() {
    // 1. קבלת הגאומטריה מהמפה
    var geoData = drawnItems.toGeoJSON();
    
    // 2. איסוף הנתונים מהטופס
    const targetDetails = {
        name: document.getElementById('targetName').value,
        priority: document.getElementById('Priority').value,
        notes: document.getElementById('notes').value
    };

    // 3. בניית המבנה שהשרת מצפה לו
    // אנחנו מוסיפים את ה-properties לתוך כל Feature
    const payload = {
        features: geoData.features.map(feature => ({
            ...feature,
            properties: targetDetails // כאן אנחנו מחברים את הנתונים מהטופס
        }))
    };

    // 4. שליחת ה-payload במקום ה-data המקורי
    const response = await fetch('/generate-xml', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload) 
    });

    if (response.ok) {
        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'manual_target.xml';
        document.body.appendChild(a);
        a.click();
        a.remove();
        alert("XML generated successfully!");
    } else {
        alert("Error generating XML");
    }
}

    function saveData() {
    const targetData = {
        name: document.getElementById('targetName').value,
        Priority: document.getElementById('Priority').value,
        notes: document.getElementById('notes').value
    };
    
    console.log("נתונים שנאספו:", targetData);
    // כאן תוכל להוסיף לוגיקה שמשייכת את זה לפוליגון האחרון שצויר
    alert("הנתונים נשמרו בהצלחה!");
    }
       	 
    </script>
</body>
</html>
